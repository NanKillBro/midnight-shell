name: Crash report
description: Report a crash
labels: ["bug", "crash"]
title: "[CRASH] "
body:
  - type: textarea
    attributes:
      label: What caused the crash
      description: |
        Any information likely to help debug the crash. What were you doing when the crash occurred,
        what changes did you make, can you get it to happen again?

  - type: markdown
    attributes:
      value: |
        ### Log & Report Files
        Please attach your files below by dragging and dropping them into the fields or using the file picker.

  - type: textarea
    attributes:
      label: Report file
      description: Drag and drop `report.txt` here or paste its contents.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Log file
      description: |
        Drag and drop `log.qslog.log` here (compress if too large).

        You can preview the log using `qs log <path-to-log> -r '*=true'`.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Version info
      description: Run `caelestia -v` and paste the result below.
      placeholder: "Paste the output of `caelestia -v` here!"
      value: |
        <details><summary>Version info</summary>

        ```
        <!-- Run `caelestia -v` and paste the result here! -->
        ```

        </details>
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Reminder
      options:
        - label: I've successfully updated to the latest versions following the [updating guide](https://github.com/dim-ghub/caelestia?tab=readme-ov-file#updating).
        - label: I've successfully updated the system packages to the latest.
        - label: I agree that it's usually impossible for others to help me without my logs.
        - label: I've ticked the checkboxes without reading their contents
